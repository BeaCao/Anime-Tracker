<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image" href="./src/assets/logoAn.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Cabeceras de seguridad ── -->
  <!-- Previene ataques XSS: solo permite scripts/estilos de fuentes explícitas -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://apis.google.com;
    style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
    font-src 'self' https://cdnjs.cloudflare.com;
    img-src 'self' data: https://cdn.myanimelist.net https://cdn.jsdelivr.net https://*.jikan.moe https://lh3.googleusercontent.com https://firebasestorage.googleapis.com;
    connect-src 'self' https://api.jikan.moe https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;
    frame-src https://anime-tracker-cf187.firebaseapp.com https://accounts.google.com;
  ">
  <!-- Evita que el navegador adivine el tipo MIME (sniffing attacks) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <!-- No envía la URL de referencia a sitios externos -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>AniKiroku</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
